<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contactform</title>
    <link rel="stylesheet" href="contactform.css">
</head>
<body>
    <main>
        <form>
            <!--First Checkbox-->
            <section>
                <p>How do you like our pizza?</p>
            <div class="container-checkbox">
                <input type="radio" name="likeability" value="aswome" id="awsome">
                <label for="awsome">Awsome</label>
                <input type="radio" name="likeability" value="good" id="good">
                <label for="good">Good</label>
                <input type="radio" name="likeability" value="Okay" id="okay1">
                <label for="okay1">Okay</label>
                <input type="radio" name="likeability" value="poor" id="poor">
                <label for="poor" >Poor</label>
            </div>
            </section>
            <!--Second Checkbox-->
            <section>
                <p>What do you think about our prizes?</p>
            <div class="container-checkbox">
                <input type="radio" name="meaning-of-price" value="fair" id="fair">
                <label for="fair">Fair</label>
                <input type="radio" name="meaning-of-price" value="okay" id="okay2">
                <label for="okay2">Okay</label>
                <input type="radio" name="meaning-of-price" value="expensive" id="expensive">
                <label for="expensive">Expensive</label>
            </div>
            </section>
            <!--Text Inputs-->
            <section>
                <p>Your name?</p>
                <input type="text" name="name" id="name">
            </section>
            <section>
                <p>Your e-mail address?</p>
                <input type="text" name="email" id="email">
            </section>
            <section>
                <p>What can we do better?</p>
                <textarea id="textarea"></textarea>
            </section>
            <button id="send">Send</button>
        </form>
    </main>
</body>
</html>
